# Bouton « Recalculer » : calcul immédiat, indépendant du veilleur.
name: recalculer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recalculer
  cancel-in-progress: false
jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
      NUAGE: "1"
      NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
      NBA_COOKIE: ${{ secrets.NBA_COOKIE }}
      ADRESSE_PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      RECALCUL_URL: https://github.com/${{ github.repository }}/actions/workflows/recalculer.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python planificateur.py --forcer
      - run: python publier.py
      - name: Enregistrer
        run: |
          git config user.name "assistant-nba"
          git config user.email "actions@users.noreply.github.com"
          git add -A rapport docs
          git diff --cached --quiet && exit 0
          git commit -qm "Recalcul manuel $(date '+%d/%m %H:%M')"
          for essai in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
