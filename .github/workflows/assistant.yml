# Deux usages :
#  - forcer = true (bouton « Recalculer », raccourci iPhone) : un calcul tout de suite, puis fin ;
#  - sinon (cron, réveil externe, relance automatique) : le veilleur. Il tourne ~5 h 50, lance le
#    planificateur toutes les 10 min (calcul avant chaque deadline, notifications, page), puis se
#    relance lui-même. Le cron ne sert qu'à redémarrer la chaîne si elle s'est arrêtée.
name: assistant
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Recalculer maintenant"
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
jobs:
  recalcul:
    if: github.event_name == 'workflow_dispatch' && inputs.forcer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: recalcul
      cancel-in-progress: false
    env:
      TZ: Europe/Paris
      NUAGE: "1"
      NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
      NBA_COOKIE: ${{ secrets.NBA_COOKIE }}
      ADRESSE_PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      RECALCUL_URL: https://github.com/${{ github.repository }}/actions/workflows/assistant.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python planificateur.py --forcer
      - run: python publier.py
      - name: Enregistrer
        run: |
          git config user.name "assistant-nba"
          git config user.email "actions@users.noreply.github.com"
          git add -A rapport docs
          git diff --cached --quiet && exit 0
          git commit -qm "Recalcul manuel $(date '+%d/%m %H:%M')"
          for essai in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done

  veille:
    if: github.event_name != 'workflow_dispatch' || !inputs.forcer
    runs-on: ubuntu-latest
    concurrency:
      group: veilleur
      cancel-in-progress: false
    timeout-minutes: 358
    env:
      TZ: Europe/Paris
      NUAGE: "1"
      NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
      NBA_COOKIE: ${{ secrets.NBA_COOKIE }}
      ADRESSE_PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      RECALCUL_URL: https://github.com/${{ github.repository }}/actions/workflows/assistant.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veille (toutes les 10 min pendant ~5 h 40)
        run: |
          git config user.name "assistant-nba"
          git config user.email "actions@users.noreply.github.com"
          fin=$(( $(date +%s) + 340*60 ))
          forcer=""
          while [ "$(date +%s)" -lt "$fin" ]; do
            git pull -q --rebase -X theirs || true
            python planificateur.py $forcer || true
            python publier.py || true
            git add -A rapport docs
            if ! git diff --cached --quiet; then
              git commit -qm "Calcul $(date '+%d/%m %H:%M')"
              for essai in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
            fi
            # pause de 10 min, interrompue par un appui sur « Recalculer » (canal ntfy_recalcul)
            if python attendre_demande.py 600; then forcer="--forcer"; else forcer=""; fi
          done
      - name: Relance du veilleur suivant
        if: always()
        run: gh workflow run assistant.yml --ref main -f forcer=false -R "${{ github.repository }}"
