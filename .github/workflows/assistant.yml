# Veilleur : tourne ~5 h 50, lance le planificateur toutes les 10 min (calcul avant chaque deadline,
# notifications, page GitHub Pages), puis se relance lui-même. Le cron ne sert qu'à redémarrer la chaîne
# si elle s'est arrêtée (GitHub ne garantit pas la fréquence des cron).
name: assistant
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: veilleur
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TZ: Europe/Paris
      NUAGE: "1"
      NTFY_SUJET: ${{ secrets.NTFY_SUJET }}
      NBA_COOKIE: ${{ secrets.NBA_COOKIE }}
      ADRESSE_PAGE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      RECALCUL_URL: https://github.com/${{ github.repository }}/actions/workflows/recalculer.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veille (toutes les 10 min pendant ~5 h 40)
        run: |
          git config user.name "assistant-nba"
          git config user.email "actions@users.noreply.github.com"
          fin=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            git pull -q --rebase -X theirs || true
            python planificateur.py || true
            python publier.py || true
            git add -A rapport docs
            if ! git diff --cached --quiet; then
              git commit -qm "Calcul $(date '+%d/%m %H:%M')"
              for essai in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
            fi
            sleep 600
          done
      - name: Relance du veilleur suivant
        if: always()
        run: gh workflow run assistant.yml --ref main -R "${{ github.repository }}"
